[project]
name = "developers"
version = "0.1.0"
description = "developers using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.4",
]

[project.scripts]
developers = "developers.main:run"
run_crew = "developers.main:run"
train = "developers.main:train"
replay = "developers.main:replay"
test = "developers.main:test"
run_with_trigger = "developers.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv.workspace]
members = [
    "sandbox",
]
