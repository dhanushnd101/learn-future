[project]
name = "researcher_dnd"
version = "0.1.0"
description = "researcher-dnd using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.4",
]

[project.scripts]
researcher_dnd = "researcher_dnd.main:run"
run_crew = "researcher_dnd.main:run"
train = "researcher_dnd.main:train"
replay = "researcher_dnd.main:replay"
test = "researcher_dnd.main:test"
run_with_trigger = "researcher_dnd.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
